name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 архива gitleaks_8.30.1_linux_x64.tar.gz с официальной страницы релиза gitleaks.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # вся история нужна gitleaks
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - name: В git нет ни одного CSV
        run: |
          if git ls-files | grep -iE '\.csv$'; then
            echo "CSV в git запрещены"; exit 1
          fi
      # Не gitleaks-action: ему нужна платная лицензия для организаций.
      # Скачиваем релизный бинарник нужной версии и сверяем контрольную сумму.
      - name: gitleaks по всей истории
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact -v --config .gitleaks.toml .
