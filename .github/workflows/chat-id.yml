name: Разовый запуск chat id

# Временный workflow: бот пишет владельцу в личный чат его chat id. В лог номер не попадает.
# После использования файл удаляется.
on:
  workflow_dispatch:

permissions: {}

jobs:
  chat-id:
    if: github.repository == 'Dzuba110729/purchase-planning-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DASHBOARD_NV_BOT }}
        run: uv run --no-sync purchasing telegram-chat-id
