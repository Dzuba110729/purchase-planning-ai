[project]
name = "purchasing"
version = "0.1.0"
description = "ИИ-система планирования закупок"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas",
]

[project.scripts]
purchasing = "purchasing.cli:main"

[dependency-groups]
dev = ["pytest", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purchasing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
